version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fuelrecorder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuel_recorder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fuelrecorder-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelrecorder-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fuel_recorder
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secret}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_change_in_production_1234567890}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - fuelrecorder-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Admin Dashboard
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      target: dev
    container_name: fuelrecorder-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_HOST: localhost
    depends_on:
      - backend
    volumes:
      - ./frontend-admin/src:/app/src
      - ./frontend-admin/public:/app/public
      - ./frontend-admin/package.json:/app/package.json
    networks:
      - fuelrecorder-network
    stdin_open: true
    tty: true

  # Frontend Technician App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: fuelrecorder-technician
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_HOST: localhost
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
    networks:
      - fuelrecorder-network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local
  backend_node_modules:

networks:
  fuelrecorder-network:
    driver: bridge
